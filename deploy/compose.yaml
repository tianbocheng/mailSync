services:
  mail-sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      MAIL_SYNC_STATE_DB: /app/data/mail_sync_state.sqlite3
      MAIL_SYNC_LOG_DIR: /app/logs
      SYNC_INTERVAL: ${SYNC_INTERVAL:-900}
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-5}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  mail-sync-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: Asia/Shanghai
      MAIL_SYNC_STATE_DB: /app/data/mail_sync_state.sqlite3
      MAIL_SYNC_LOG_DIR: /app/logs
      MAIL_SYNC_WEB_PORT: ${MAIL_SYNC_WEB_PORT:-8080}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    ports:
      - "${MAIL_SYNC_WEB_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    stop_grace_period: 10s
