services:
  mail-sync:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      MAIL_SYNC_STATE_DB: /app/data/mail_sync_state.sqlite3
      SYNC_INTERVAL: ${SYNC_INTERVAL:-900}
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-5}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    tmpfs:
      - /tmp
    stop_grace_period: 30s
